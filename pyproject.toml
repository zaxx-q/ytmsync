[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytmsync"
version = "0.1.0"
description = "Download and sync YouTube Music playlists using yt-dlp"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"          # tomllib is stdlib from 3.11
dependencies = [
  "yt-dlp[default,deno]",           # D13. `doctor` warns if the installed yt-dlp is >45 days old
  "ytmusicapi>=1.12",
  "mediafile>=0.17",
  "mutagen>=1.47",
  "pillow>=10",
  "requests>=2.32",
  "click>=8.1",
  "rich>=13",
  "platformdirs>=4",
  "syncedlyrics>=1.0",              # Musixmatch/NetEase lyrics (D15/D16)
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]
[project.scripts]
ytmsync = "ytmsync.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/ytmsync"]
